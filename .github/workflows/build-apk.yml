name: Build and Sign Android App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build web app
        run: |
          cd frontend
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: |
          cd frontend
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x frontend/android/gradlew

      - name: Build Signed Release APK & AAB
        run: |
          cd frontend/android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TechInnovate-Mobility-Release-APK
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: TechInnovate-Mobility-Release-AAB
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
